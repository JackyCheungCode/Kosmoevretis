name: Build and typecheck
on:
  push:
    branches: [3c-platform, main]
  pull_request:
    branches: [3c-platform, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run design-system:check
      - run: npm run build
